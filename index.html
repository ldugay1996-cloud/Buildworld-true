<!doctype html>
<html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>BuildWorld</title><style>body{margin:0;background:#87ceeb;font-family:Arial;overflow:hidden}canvas{display:block;width:100vw;height:100vh}.ui{position:fixed;inset:0;pointer-events:none}.title{padding:12px;color:white;font-weight:bold;text-shadow:2px 2px #333}.buttons{position:absolute;bottom:18px;left:0;right:0;display:flex;justify-content:center;gap:8px;pointer-events:auto}.buttons button{font-size:20px;padding:12px 16px;border:0;border-radius:12px;background:#fff9;}.hint{position:absolute;top:45px;left:12px;color:white;text-shadow:1px 1px #333}</style></head><body><canvas id="game"></canvas><div class="ui"><div class="title">🌍 BuildWorld</div><div class="hint">Tap a block to break it • Build mode: tap empty space</div><div class="buttons"><button onclick="mode='break'">⛏️ Break</button><button onclick="mode='build'">🧱 Build</button><button onclick="resetWorld()">🔄 Reset</button></div></div><script>const c=document.getElementById('game'),x=c.getContext('2d');let mode='break',cols=16,rows=9,cell=50,world=[];function resize(){c.width=innerWidth;c.height=innerHeight;cell=Math.min(c.width/cols,60);rows=Math.ceil(c.height/cell);resetWorld()}function resetWorld(){world=Array.from({length:rows},(_,y)=>Array.from({length:cols},()=>y>rows-3?'grass':y===rows-3?'dirt':'air'));draw()}function draw(){x.clearRect(0,0,c.width,c.height);x.fillStyle='#87ceeb';x.fillRect(0,0,c.width,c.height);for(let y=0;y<rows;y++)for(let z=0;z<cols;z++){let b=world[y][z];if(b==='air')continue;x.fillStyle=b==='grass'?'#55b947':'#9b6b43';x.fillRect(z*cell,y*cell,cell-1,cell-1);if(b==='grass'){x.fillStyle='#3b8f35';x.fillRect(z*cell,y*cell,cell-1,7)}}}c.addEventListener('pointerdown',e=>{let z=Math.floor(e.clientX/cell),y=Math.floor(e.clientY/cell);if(y<0||y>=rows||z<0||z>=cols)return;if(mode==='break')world[y][z]='air';else if(world[y][z]==='air' && y>0)world[y][z]='grass';draw()});addEventListener('resize',resize);resize();</script></body></html>
