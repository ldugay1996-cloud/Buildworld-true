<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>BuildWorld</title><style>body{margin:0;background:#87ceeb;font-family:Arial;overflow:hidden;touch-action:none}canvas{display:block;width:100vw;height:100vh}.ui{position:fixed;inset:0;pointer-events:none}.title{padding:12px;color:white;font-weight:bold;font-size:20px;text-shadow:2px 2px #333}.hint{position:absolute;top:48px;left:12px;color:white;text-shadow:1px 1px #333}.buttons{position:absolute;bottom:18px;left:0;right:0;display:flex;justify-content:center;gap:8px;pointer-events:auto}.buttons button{font-size:18px;padding:12px 15px;border:0;border-radius:12px;background:#fff9}.selected{outline:3px solid #ffd43b}</style></head><body><canvas id="game"></canvas><div class="ui"><div class="title">🌍 BuildWorld</div><div class="hint" id="hint">Break mode: tap a block to remove it</div><div class="buttons"><button id="breakBtn" class="selected">⛏️ Break</button><button id="buildBtn">🧱 Build</button><button id="resetBtn">🔄 Reset</button></div></div><script>const c=document.getElementById('game'),ctx=c.getContext('2d');let mode='break',cols=16,rows=9,cell=50,world=[];function resize(){c.width=innerWidth;c.height=innerHeight;cell=Math.min(c.width/cols,60);rows=Math.ceil(c.height/cell);resetWorld()}function resetWorld(){world=Array.from({length:rows},(_,y)=>Array.from({length:cols},()=>y>=rows-2?'grass':y===rows-3?'dirt':'air'));draw()}function draw(){ctx.clearRect(0,0,c.width,c.height);ctx.fillStyle='#87ceeb';ctx.fillRect(0,0,c.width,c.height);for(let y=0;y<rows;y++)for(let z=0;z<cols;z++){let b=world[y][z];if(b==='air')continue;ctx.fillStyle=b==='grass'?'#55b947':'#9b6b43';ctx.fillRect(z*cell,y*cell,cell-1,cell-1);if(b==='grass'){ctx.fillStyle='#3b8f35';ctx.fillRect(z*cell,y*cell,cell-1,7)}}}function setMode(m){mode=m;breakBtn.classList.toggle('selected',m==='break');buildBtn.classList.toggle('selected',m==='build');hint.textContent=m==='break'?'Break mode: tap a block to remove it':'Build mode: tap anywhere to place a block'}breakBtn.onclick=()=>setMode('break');buildBtn.onclick=()=>setMode('build');resetBtn.onclick=resetWorld;c.addEventListener('pointerdown',e=>{const rect=c.getBoundingClientRect();const z=Math.floor((e.clientX-rect.left)/rect.width*cols);const y=Math.floor((e.clientY-rect.top)/rect.height*rows);if(z<0||z>=cols||y<0||y>=rows)return;if(mode==='break'){if(world[y][z]!=='air')world[y][z]='air'}else{world[y][z]='grass'}draw()});addEventListener('resize',resize);resize();</script></body></html>
